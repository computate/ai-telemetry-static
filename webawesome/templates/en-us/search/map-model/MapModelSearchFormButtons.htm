          <div id="htmSearchForm">
            <wa-scroller>
              <wa-button-group>
                {% if "PATCH" in scopes %}
                {% if resultCount == 1 and result is defined %}
                <wa-button variant="brand" id="refreshThisMapModelGenPage"
                     onclick="patch{{classSimpleName}}Vals( [ {name: 'fq', value: 'entityShortId:{{ result.entityShortId }}' } ], {}, this, function() { addGlow(document.querySelector('#refreshThisMapModelGenPage')); }, function(response, target) { addError(document.querySelector('#refreshThisMapModelGenPage'), response); }); return false; ">
                  <i slot="start" class="{{ FONTAWESOME_STYLE }} fa-sync-alt "></i>
                  refresh
                </wa-button>
                {% endif %}
                {% if resultCount > 0 and result is not defined %}
                <wa-button variant="brand" id="refreshAllMapModelGenPage{{ result.entityShortId | e }}"
                     onclick="patch{{classSimpleName}}Vals([], {}, this, function() { addGlow(document.querySelector('#refreshAllMapModelGenPage{{ result.entityShortId | e }}')); }, function(response, target) { addError(document.querySelector('#refreshAllMapModelGenPage{{ result.entityShortId | e }}'), response); }); "
                    >
                  <i slot="start" class="{{ FONTAWESOME_STYLE }} fa-arrows-rotate"></i>
                  refresh all 
                </wa-button>
                {% endif -%}
                {% endif -%}

              </wa-button-group>
            </wa-scroller>
          </div>
